<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcher Ermittlertyp sind Sie? — Hidden Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Open+Sans:wght@400;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <img class="logo" src="img/logo.svg" alt="Hidden Games">

    <nav class="langs" id="langs" aria-label="Sprache"></nav>
  </div>

  <div class="pending" id="pending"></div>

  <div class="stage">

    <!-- ===== INTRO ===== -->
    <section id="screen-intro" class="card">
      <div class="tape skew intro-tape" id="introTape">— TATORT — ZUTRITT NUR FÜR ERMITTLER —</div>
      <div class="kicker" id="introKicker"></div>
      <h1 id="introTitle"></h1>
      <p class="lead" id="introLead"></p>
      <div class="sig" id="introSig"></div>
      <div class="meta" id="introMeta"></div>
      <button class="btn" id="startBtn"></button>
      <div class="intro-photo" aria-hidden="true"></div>
    </section>

    <!-- ===== QUIZ ===== -->
    <section id="screen-quiz" class="card hidden">
      <div class="progress-row">
        <span class="qcount" id="qcount"></span>
        <span class="bar"><i id="barfill"></i></span>
      </div>
      <div class="qno" id="qno"></div>
      <h2 class="question" id="questionText"></h2>
      <div class="opts" id="opts"></div>
      <div class="nav">
        <button class="btn ghost" id="backBtn"></button>
        <button class="btn" id="nextBtn"></button>
      </div>
    </section>

    <!-- ===== RESULT ===== -->
    <section id="screen-result" class="card hidden">
      <div class="res-head">
        <div class="res-label" id="resLabel"></div>
        <div class="res-name" id="resName"></div>
        <div class="res-tag" id="resTag"></div>
      </div>
      <div class="res-top">
        <div class="portrait" id="resultPortrait"><span class="pin"></span><div class="stamp" id="stamp"></div><small id="portraitNote"></small></div>
        <div class="res-body">
          <div class="res-desc" id="resDesc"></div>
          <div class="block-label" id="collLabel"></div>
          <div class="colleagues" id="resColl"></div>
        </div>
      </div>
      <div class="hahnke-note" id="resHahnke"></div>
      <div id="caseSection">
        <div class="case-head" id="caseLabel"></div>
        <div class="casecard" id="caseCard">
          <span class="ribbon" id="caseRibbon"></span>
          <div class="ct-row">
            <img class="ct-img" id="caseImg" alt="" hidden>
            <div class="ct-text">
              <div class="ct-title-row"><div class="ct-title" id="caseTitle"></div><span class="new-badge" id="caseNewBadge" hidden></span></div>
              <div class="ct-blurb" id="caseBlurb"></div>
              <div class="buy-actions" id="buyActions"></div>
            </div>
          </div>
          <button class="alt-btn" id="altBtn" type="button"></button>
        </div>
      </div>
      <div class="divider"></div>
      <div class="share-head" id="shareHead"></div>
      <div class="share-hint" id="shareHint"></div>
      <div class="photo-actions">
        <button class="btn ghost" id="photoBtn" type="button"></button>
        <button class="btn ghost" id="photoResetBtn" type="button" hidden></button>
        <input type="file" id="photoInput" accept="image/*" hidden>
      </div>
      <div class="photo-hint" id="photoHint"></div>
      <div class="card-preview-wrap"><img id="cardPreview" alt=""></div>
      <div class="res-actions">
        <button class="btn" id="saveBtn"></button>
        <button class="btn ghost" id="shareImgBtn" hidden></button>
        <button class="btn ghost" id="captionBtn"></button>
      </div>
      <div class="res-actions">
        <button class="btn ghost" id="restartBtn"></button>
        <span class="copied" id="copied"></span>
      </div>
    </section>

  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
